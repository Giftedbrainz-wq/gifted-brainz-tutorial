<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#082d63"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/assets/favicon.ico">
<title>1-v-1 Challenge • Gifted Brainz Tutorial</title><link rel="stylesheet" href="/styles.css">
</head>
<body><div class="network-banner" id="networkBanner"></div><div id="shell"><div class="main"><div class="topbar"><div class="page-title"><span class="ic">⚔️</span> 1-v-1 Challenge</div><div class="topbar-right"><span class="who" id="who"></span><button class="btn light" onclick="GB.logout()">Log out</button></div></div>
<div class="content"><div class="hero-banner"><div class="eyebrow">Head-to-head practice</div><h1>1-v-1 Challenge ⚔️</h1><p>Create a private room and challenge another student using questions from the Gifted Brainz question bank.</p></div>
<div id="home" class="panelgrid"><div class="card"><div class="section-head"><h2>Create a challenge</h2></div><label>Subject<select id="subject"></select></label><label>Questions<select id="count"><option value="5">5 questions</option><option value="10" selected>10 questions</option><option value="15">15 questions</option><option value="20">20 questions</option></select></label><button class="btn gold" id="create">Create 1-v-1 room</button><div id="createMsg"></div></div>
<div class="card"><div class="section-head"><h2>Join a challenge</h2></div><p class="muted">Enter the six-digit room code shared by your opponent.</p><input id="code" inputmode="numeric" maxlength="6" placeholder="e.g. 482913"><button class="btn light" id="join" style="margin-top:10px">Join room</button><div id="joinMsg"></div></div></div>
<div id="room" hidden></div><div id="history" class="card" style="margin-top:18px"><div class="section-head"><h2>Recent 1-v-1 matches</h2></div><div id="historyOut"><p class="muted">Loading…</p></div></div>
</div></div></div>
<script src="/app.js"></script><script src="/api.js"></script><script src="/gb-ui.js"></script>
<script>
if(!GB.token()) location="/login.html"; GBUI.mount({active:"/duel.html"}); const $=id=>document.getElementById(id); let duel=null, timer=null;
$('subject').innerHTML=GBUI.SUBJECTS.map(s=>`<option>${GBUI.esc(s)}</option>`).join('');
const msg=(id,text,ok=false)=>{$(id).innerHTML=text?`<p class="${ok?'success':'error'}">${GBUI.esc(text)}</p>`:''};
async function create(){msg('createMsg','');$('create').disabled=true;try{duel=await GB.api('/api/duel/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:$('subject').value,count:Number($('count').value)})});renderRoom()}catch(e){msg('createMsg',e.message)}finally{$('create').disabled=false}}
async function join(){msg('joinMsg','');$('join').disabled=true;try{duel=await GB.api('/api/duel/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value.trim()})});renderRoom()}catch(e){msg('joinMsg',e.message)}finally{$('join').disabled=false}}
function renderRoom(){ $('home').hidden=true;$('history').hidden=true;$('room').hidden=false; if(timer)clearInterval(timer); draw(); timer=setInterval(refresh,3000); }
function draw(){if(!duel)return; const me=duel.players.find(p=>p.id===duel.myId)||duel.players[0]; const answered=Object.keys(duel.myAnswers||{}).length; const q=duel.questions[answered]; const waitingLeft=duel.status==='waiting'&&duel.expiresAt?Math.max(0,Date.parse(duel.expiresAt)-Date.now()):0; let html=`<div class="card"><div class="section-head"><h2>Room ${GBUI.esc(duel.code)}</h2><span class="pill">${GBUI.esc(duel.status)}</span></div><p><b>${GBUI.esc(duel.subject)}</b> · ${duel.count} questions</p><div class="statgrid">${duel.players.map(p=>`<div class="statcard plain"><div class="ic">👤</div><strong>${p.score==null?'—':p.score+'/'+duel.count}</strong><small>${GBUI.esc(p.name)}${p.id===me?.id?' (you)':''}</small><small>${p.submitted?'Submitted':'Playing'}</small></div>`).join('')}</div>`;
if(duel.status==='waiting') html+=`<div class="card" style="margin-top:14px;text-align:center"><h3>Waiting for your opponent</h3><p class="muted">Share this room code:</p><div style="font-size:2.2rem;font-weight:900;letter-spacing:.15em">${GBUI.esc(duel.code)}</div><p class="muted">This room code expires in <b>${Math.ceil(waitingLeft/60000)} minute(s)</b>. Keep this page open. The match starts automatically when another student joins.</p></div>`;
else if(duel.status==='finished') { const scores=duel.players.map(p=>p.score||0); const best=Math.max(...scores); const winners=duel.players.filter(p=>(p.score||0)===best); html+=`<div class="result-card" style="margin-top:14px;text-align:center"><h2>${winners.length>1?'Draw 🤝':'Winner 🏆'}</h2><p>${winners.length>1?'Both players finished with the same score.':GBUI.esc(winners[0].name)+' wins the challenge.'}</p><p class="muted">Final score: ${duel.players.map(p=>GBUI.esc(p.name)+' '+(p.score||0)+'/'+duel.count).join(' · ')}</p></div>`;}
else if(duel.status==='cancelled'||duel.status==='expired') html+=`<div class="card" style="margin-top:14px;text-align:center"><h3>Room ${duel.status}</h3><p class="muted">${duel.status==='expired'?'The 15-minute room-code window has ended.':'This match room is no longer active.'}</p></div>`; else if(q){html+=`<div class="card" style="margin-top:14px"><div class="section-head"><h3>Question ${answered+1} of ${duel.count}</h3></div><p style="font-size:1.08rem;font-weight:800">${GBUI.esc(q.q)}</p><div>${q.options.map((o,i)=>`<button class="btn light" data-answer="${i}" style="display:block;width:100%;text-align:left;margin:8px 0">${String.fromCharCode(65+i)}. ${GBUI.esc(o)}</button>`).join('')}</div></div>`;} else html+=`<div class="card" style="margin-top:14px"><p>All your answers are recorded. Waiting for the other player…</p></div>`;
html+=`<div style="display:flex;justify-content:center;margin-top:14px"><button class="btn light" id="leaveRoom">Leave current room</button></div></div>`;$('room').innerHTML=html; $('leaveRoom').onclick=leaveRoom; document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>answer(Number(b.dataset.answer)))); }
async function answer(v){const index=Object.keys(duel.myAnswers||{}).length;try{duel=await GB.api('/api/duel/'+encodeURIComponent(duel.id)+'/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({index,answer:v})});draw()}catch(e){alert(e.message)}}
async function leaveRoom(){if(!duel)return;if(!confirm('Leave this 1-v-1 room? You will need to create or join another room afterwards.'))return;try{await GB.api('/api/duel/'+encodeURIComponent(duel.id)+'/leave',{method:'POST'});clearInterval(timer);duel=null;$('room').hidden=true;$('home').hidden=false;$('history').hidden=false;await loadHistory()}catch(e){alert(e.message)}}
async function refresh(){if(!duel)return;try{const d=await GB.api('/api/duel/'+encodeURIComponent(duel.id));duel=d;draw();if(duel.status==='finished'||duel.status==='cancelled'||duel.status==='expired'){clearInterval(timer);await loadHistory()}}catch(e){if(e&&(/expired|not found|already left/i).test(e.message||'')){clearInterval(timer);alert(e.message);location.reload()}}}
async function loadHistory(){try{const rows=await GB.api('/api/duels/mine');const current=rows.find(r=>r.canLeave&&['waiting','active','finished','cancelled'].includes(r.status));if(current&&!duel){duel=current;renderRoom();return}$('historyOut').innerHTML=rows.length?rows.map(r=>`<div class="lbrow"><span>⚔️</span><span class="nm">${GBUI.esc(r.subject)} · ${GBUI.esc(r.code)}</span><span>${r.status}</span><span>${r.myScore==null?'—':r.myScore+'/'+r.count}</span></div>`).join(''):'<p class="muted">No 1-v-1 matches yet.</p>'}catch(e){$('historyOut').innerHTML=`<p class="error">${GBUI.esc(e.message)}</p>`}}
$('create').onclick=create;$('join').onclick=join;loadHistory();
</script></body></html>
